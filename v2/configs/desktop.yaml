# Desktop (Windows PC) profile. Schema must match pi5-4gb.yaml exactly — tests/test_config_drift.py
server: { host: 127.0.0.1, port: 8000 }
audio: { sample_rate: 16000, frame_ms: 32 }
vad: { threshold: 0.5, min_silence_ms: 300, speech_pad_ms: 30, min_speech_ms: 250 }
turn:
  model: models/turn/smart-turn-v3.2-cpu.onnx
  threshold: 0.5
  force_after_ms: 2000      # if a turn is "incomplete" and no speech resumes, process anyway
wake:
  dir: models/wakeword
  names: [hey_jarvis]        # placeholder until a trained hey_tobi model drops in this dir
  threshold: 0.5
  refractory_ms: 2000
stt:
  model_dir: models/stt-tiny
  compute_type: int8
  language: en
  partial_every_ms: 700
tts:
  voice: models/tts/en_US-lessac-low.onnx
  gain: 1.0
brain: { type: stub }
greeting: "I'm listening."
dormancy: { timeout_s: 90 }
session: { log_dir: logs, save_utterance_audio: true }
store: { path: data/transcripts.db }
tools:
  weather: { enabled: true }
  search: { enabled: true, max_results: 3 }
  telegram: { enabled: true, token_env: TOBI_TG_TOKEN, chat_id_env: TOBI_TG_CHAT }
meeting:
  diarize:
    segmentation: models/diarize/segmentation.onnx
    embedding: models/diarize/embedding.onnx
    num_clusters: 0           # 0 = auto-cluster by threshold
    threshold: 0.5
