# Pi 5 4GB profile. English-first. Telugu re-enable later WITHOUT code change.
# No user-facing timers. Internal numbers below are ceilings, not UX.
# Sovereignty: every model below is a LOCAL file. Nothing downloads at runtime.
sample_rate: 16000
wakeword: "hey tobi"
wakeword_onnx: models/hey_jarvis_v0.1.onnx  # stand-in until hey_tobi trained
dormant_after_silence_s: 30
vad:
  backend: auto  # silero-v5 (onnxruntime, models/silero_vad_v5.onnx ~2MB) | energy
  threshold: 0.6
  onnx_path: models/silero_vad_v5.onnx
turn:
  backend: auto  # smart-turn-onnx | adaptive (adaptive default on 4GB, saves RAM)
  min_speech_ms: 300
stt:
  backend: auto  # whistle (16.9MB fast-path) + faster-whisper tiny fallback | mock=not cached
  whistle_path: models/whistle.cact
  model: tiny
  model_path: models/stt-tiny
  compute_type: int8
llm:
  backend: stub  # stub | openai-compatible (loopback/LAN only — cloud URLs refused)
  base_url: http://127.0.0.1:8080/v1
  model: local-slm
tts:
  backend: auto  # piper (models/en_US-lessac-low.onnx ~63MB) | mock
  voice: models/en_US-lessac-low.onnx
logging:
  dir: logs
