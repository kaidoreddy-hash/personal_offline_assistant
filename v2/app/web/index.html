<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tobi v2 — offline, hey tobi to wake</title>
<style>body{font-family:system-ui;margin:0;background:#0b0f14;color:#e8eef4}main{max-width:720px;margin:24px auto;padding:0 16px}
#dot{width:12px;height:12px;border-radius:50%;background:#555;display:inline-block;margin-right:8px}
.live{color:#7CFFB2}.reply{white-space:pre-wrap;background:#131b24;padding:12px;border-radius:10px;min-height:80px}
#partial{opacity:.75;min-height:1.5em}.row{display:flex;gap:8px;margin:12px 0}button{padding:10px 14px;border-radius:8px;border:0;background:#1f6feb;color:#fff;cursor:pointer}
input{flex:1;padding:10px;border-radius:8px;border:1px solid #333;background:#111;color:#eee}</style></head>
<body><main>
<h3><span id="dot"></span><span id="state">dormant — say “hey tobi”</span></h3>
<div class="row"><button id="mic">Enable mic</button><button id="wake">Simulate “hey tobi”</button></div>
<div id="partial" class="live"></div>
<div id="reply" class="reply"></div>
<div class="row"><input id="txt" placeholder="or type here (tests same pipeline)"><button id="send">Send</button></div>
<p style="opacity:.6;font-size:13px">Fully offline: mic PCM is transcribed on this machine (faster-whisper), replies synthesised locally (Piper). No cloud speech APIs. Handsfree — speak over a reply to barge in.</p>
<script>
const $=id=>document.getElementById(id), ws=new WebSocket(`ws://${location.host}/ws`);
let speaking=false, AC=null;
ws.onmessage=e=>{const m=JSON.parse(e.data);
 if(m.event==="state"){$("state").textContent=m.state==="dormant"?"dormant — say “hey tobi”":m.state;
  $("dot").style.background=m.state==="listening"?"#2ecc71":m.state==="responding"?"#f1c40f":"#555";if(m.state!=="responding")speaking=false;}
 if(m.event==="live_transcript")$("partial").textContent="🗣 "+m.text;
 if(m.event==="llm_chunk")$("reply").textContent+=m.text;
 if(m.event==="tts_text"){playServerAudioPending=m.tts_audio||null;$("partial").textContent="";
  // server sends tts_audio separately; fallback to local voice if Piper absent
  if(!m.wav_b64)fallbackSpeak(m.text);}
 if(m.event==="tts_audio"&&m.wav_b64)playWav(m.wav_b64);
 if(m.event==="log")window._log=m.file;};
let playServerAudioPending=null;
function fallbackSpeak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);speaking=true;
 u.onend=()=>speaking=false;u.onerror=()=>speaking=false;speechSynthesis.speak(u);}catch(e){}}
async function playWav(b64){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
 const raw=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)).buffer;
 const buf=await AC.decodeAudioData(raw.slice(0));const s=AC.createBufferSource();s.buffer=buf;s.connect(AC.destination);
 speaking=true;s.onended=()=>speaking=false;s.start();}catch(e){}}
$("wake").onclick=()=>{$("reply").textContent="";ws.send(JSON.stringify({event:"wakeword"}));};
$("send").onclick=()=>{const t=$("txt").value.trim();if(!t)return;$("reply").textContent="";$("txt").value="";
 ws.send(JSON.stringify({event:"final",text:t}));};
// OFFLINE mic: raw 16k PCM frames -> server (local STT). No cloud browser STT anywhere.
$("mic").onclick=async()=>{const s=await navigator.mediaDevices.getUserMedia({audio:{sampleRate:16000,channelCount:1,echoCancellation:true}});
 const C=new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000}),src=C.createMediaStreamSource(s),
 an=C.createAnalyser();an.fftSize=1024;src.connect(an);
 const proc=C.createScriptProcessor(4096,1,1);src.connect(proc);proc.connect(C.destination);
 const d=new Uint8Array(an.fftSize);let awake=false,sil=0,heard="";
 // wakeword text comes back from SERVER live_transcript (local STT); type fallback also arms it
 proc.onaudioprocess=ev=>{const ch=ev.inputBuffer.getChannelData(0),pcm=new Int16Array(ch.length);
  for(let i=0;i<ch.length;i++)pcm[i]=Math.max(-32768,Math.min(32767,ch[i]*32768));
  // local energy gate for barge-in signalling only (server VAD decides)
  an.getByteTimeDomainData(d);let sum=0;for(const v of d)sum+=(v-128)**2;
  const speech=Math.sqrt(sum/d.length)/128>0.03;
  if(speech&&speaking)ws.send(JSON.stringify({event:"barge_in"}));
  // stream PCM; server transcribes offline and returns live_transcript/final
  let bin="";const b=new Uint8Array(pcm.buffer);for(let i=0;i<b.length;i+=512)bin+=String.fromCharCode.apply(null,b.subarray(i,i+512));
  ws.send(JSON.stringify({event:"audio",pcm_b64:btoa(bin)}));};
 $("mic").textContent="Mic live ✓ (offline)";$("mic").disabled=true;};
</script></main></body></html>
